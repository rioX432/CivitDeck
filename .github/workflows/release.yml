name: Release

on:
  push:
    tags:
      - "v*"
  # A manual run only builds the unsigned iOS IPA as an Actions artifact; it never publishes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build signed Android APK
  build-android:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      # Only the githubFull flavor is published: in-app self-update installs the first .apk
      # asset of the latest release, and the fdroid flavor has neither self-update nor ML.
      - name: Build signed APK
        run: ./gradlew :androidApp:assembleGithubFullRelease
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Without a usable RELEASE_KEYSTORE, AGP emits androidApp-githubFull-release-unsigned.apk
      # instead, so this cp fails rather than publishing an APK that breaks update signature continuity.
      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp androidApp/build/outputs/apk/githubFull/release/androidApp-githubFull-release.apk \
            "CivitDeck-${VERSION}-android.apk"

      - name: Generate SHA-256 checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum "CivitDeck-${VERSION}-android.apk" > "CivitDeck-${VERSION}-android.apk.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            CivitDeck-*-android.apk
            CivitDeck-*-android.apk.sha256

  # Build macOS DMG
  build-macos:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Rename DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(find desktopApp/build/compose/binaries -name "*.dmg" | head -1)
          cp "$DMG" "CivitDeck-${VERSION}-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: CivitDeck-*-macos.dmg

  # Build Windows MSI
  build-windows:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi

      - name: Rename MSI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MSI=$(find desktopApp/build/compose/binaries -name "*.msi" | head -1)
          cp "$MSI" "CivitDeck-${VERSION}-windows.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: CivitDeck-*-windows.msi

  # Build Linux DEB
  build-linux:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb

      - name: Rename DEB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(find desktopApp/build/compose/binaries -name "*.deb" | head -1)
          cp "$DEB" "CivitDeck-${VERSION}-linux.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: CivitDeck-*-linux.deb

  # Build unsigned iOS device IPA (no Apple account or certificates).
  # Adapted from bpawnzZ/CivitDeck commits 9530081 and 1d24997.
  build-ios:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The app uses Swift 6.1+ syntax, so it needs Xcode 26.x (Swift 6.2), as in CI.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-

      # CFBundleShortVersionString and CFBundleVersion accept only numbers and dots, so
      # prerelease tags are rejected rather than published with a truncated version.
      # The build triple (1+n/10000).((n/100)%100).(n%100) increases with every run number n.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          n="$GITHUB_RUN_NUMBER"
          run_number_pattern='^[1-9][0-9]{0,11}$'
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$n" =~ $run_number_pattern ]]; then
            echo "::error::GITHUB_RUN_NUMBER must be a positive integer, got '$n'"
            exit 1
          fi
          major=$((1 + n / 10000))
          if [ "$major" -gt 999999999 ]; then
            echo "::error::build number component $major is out of range"
            exit 1
          fi
          build="$major.$(((n / 100) % 100)).$((n % 100))"
          if [ "$EVENT_NAME" = "push" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
              echo "::error::release tags must be vMAJOR.MINOR.PATCH, got '$GITHUB_REF_NAME'"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            ipa="CivitDeck-${version}-ios-unsigned.ipa"
          else
            version="0.0.0"
            ipa="CivitDeck-${version}-run${n}.${GITHUB_RUN_ATTEMPT}-ios-unsigned.ipa"
          fi
          echo "Version $version, build $build, file $ipa"
          {
            echo "version=$version"
            echo "build=$build"
            echo "ipa=$ipa"
          } >> "$GITHUB_OUTPUT"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: cd iosApp && swiftlint --strict

      - name: Test IPA packaging script
        run: |
          bash -n scripts/package_unsigned_ipa.sh
          python3 -m unittest discover -s scripts/tests -p 'test_unsigned_ipa.py' -v

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            DEVELOPMENT_TEAM='' \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/package_unsigned_ipa.sh \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            "dist/$IPA" "$VERSION" "$BUILD"
          (cd dist && shasum -a 256 -c "$IPA.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          if-no-files-found: error
          path: |
            dist/CivitDeck-*-ios-unsigned.ipa
            dist/CivitDeck-*-ios-unsigned.ipa.sha256

  # Create GitHub Release with all artifacts
  create-release:
    # Publishing needs a tag push and an explicit success from every platform, so a failed,
    # cancelled or skipped build (including every manual run) can never publish a partial release.
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.build-android.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    needs: [build-android, build-macos, build-windows, build-linux, build-ios]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract text between this version header and the next version header
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write to file to preserve formatting
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CivitDeck ${GITHUB_REF_NAME#v}" \
            --notes-file release_notes.txt \
            --latest \
            artifacts/*
